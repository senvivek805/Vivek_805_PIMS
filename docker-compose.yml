services:
  postgres:
    image: postgres:16-alpine
    container_name: pims_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pims_db
      POSTGRES_USER: pims_user
      POSTGRES_PASSWORD: pims_password_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pims_network

  redis:
    image: redis:7-alpine
    container_name: pims_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pims_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pims_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pims.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pims_network

volumes:
  postgres_data:
  redis_data:

networks:
  pims_network:
    driver: bridge